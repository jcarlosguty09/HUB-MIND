<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agenda tu clase de prueba · Hub Mind</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:Inter,system-ui,-apple-system,sans-serif}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px}.card{width:min(620px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 20px 60px rgba(15,23,42,.08);overflow:hidden}
    .head{padding:28px 30px 20px;border-bottom:1px solid #eef0f4}.brand{font-weight:900;letter-spacing:.08em}.sub{font-size:13px;color:#6b7280;margin-top:4px}.body{padding:24px 30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}
    label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #dbe0e8;border-radius:11px;padding:12px 13px;font:inherit;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
    textarea{resize:vertical;min-height:90px}.consent{font-size:11px;color:#6b7280;line-height:1.5;margin:8px 0 18px}.btn{width:100%;border:0;border-radius:11px;padding:13px 16px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:12px}.ok{display:block;background:#ecfdf5;color:#047857}.err{display:block;background:#fef2f2;color:#b91c1c}
    @media(max-width:620px){.grid{grid-template-columns:1fr}.body,.head{padding-left:20px;padding-right:20px}}
  </style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <header class="head">
      <div class="brand">HUB MIND</div>
      <h1>Agenda tu clase de prueba</h1>
      <div class="sub">Cuéntanos un poco de ti y nuestro equipo te contactará para encontrar la mejor clase.</div>
    </header>
    <form class="body" id="trial-form">
      <div class="grid">
        <div class="field full"><label>Nombre completo *</label><input id="name" required autocomplete="name"></div>
        <div class="field"><label>WhatsApp *</label><input id="phone" required type="tel" autocomplete="tel"></div>
        <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
        <div class="field"><label>Me interesa</label><select id="interest"><option>CrossFit</option><option>HYROX</option><option>Strength Lab</option><option>Open Box</option><option>Otro</option></select></div>
        <div class="field"><label>Experiencia</label><select id="experience"><option value="none">Nunca he hecho CrossFit</option><option value="beginner">Principiante</option><option value="intermediate">Intermedio</option><option value="advanced">Avanzado</option></select></div>
        <div class="field"><label>Objetivo principal</label><select id="goal"><option>Mejorar condición</option><option>Ganar músculo</option><option>Bajar grasa</option><option>Salud</option><option>Competir</option><option>Otro</option></select></div>
        <div class="field"><label>Horario preferido</label><select id="time"><option>Mañana</option><option>Mediodía</option><option>Tarde</option><option>Me es indistinto</option></select></div>
        <div class="field full"><label>¿Cómo nos conociste?</label><select id="source"><option value="instagram">Instagram</option><option value="facebook">Facebook</option><option value="whatsapp">WhatsApp</option><option value="referral">Referido</option><option value="walk_in">Pasé por aquí</option><option value="website">Google / Website</option><option value="event">Evento</option><option value="other">Otro</option></select></div>
        <div class="field full"><label>¿Algo que debamos saber?</label><textarea id="note" placeholder="Ej. Me interesa entrenar a las 7 pm..."></textarea></div>
      </div>
      <div class="consent">Al enviar tus datos aceptas que Hub Mind te contacte para dar seguimiento a tu solicitud. La responsiva deportiva completa se manejará como un paso separado antes de entrenar.</div>
      <button class="btn" id="submit" type="submit">Quiero mi clase de prueba</button>
      <div class="msg" id="msg"></div>
    </form>
  </main>
</div>
<script>
  // Usa las mismas credenciales públicas (URL + anon key) que tu app.
  const SUPABASE_URL = 'https://lvygabtezorvdcbmclxn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Imx2eWdhYnRlem9ydmRjYm1jbHhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NTcyMTcsImV4cCI6MjA5ODMzMzIxN30.Nh0QWZPYfoB5imz6akSvKLkVUkV2oXKpP-RfxfAoiU0';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('trial-form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = '';

    const params = new URLSearchParams(location.search);
    const campaign = params.get('utm_campaign');
    const medium = params.get('utm_medium');
    const sourceUtm = params.get('utm_source');

    const payload = {
      p_org_slug: 'hub-mind',
      p_full_name: document.getElementById('name').value.trim(),
      p_phone: document.getElementById('phone').value.trim(),
      p_email: document.getElementById('email').value.trim() || null,
      p_source: document.getElementById('source').value,
      p_interest: document.getElementById('interest').value,
      p_experience_level: document.getElementById('experience').value,
      p_goal: document.getElementById('goal').value,
      p_preferred_time: document.getElementById('time').value,
      p_note: document.getElementById('note').value.trim() || null,
      p_trial_requested: true,
      p_metadata: { utm_source: sourceUtm, utm_medium: medium, utm_campaign: campaign }
    };

    const { data, error } = await db.rpc('intake_crm_lead', payload);

    btn.disabled = false;

    if (error) {
      console.error(error);
      msg.className = 'msg err';
      msg.textContent = 'No pudimos registrar tu solicitud. Intenta nuevamente.';
      return;
    }

    form.reset();
    msg.className = 'msg ok';
    msg.textContent = '¡Listo! Ya recibimos tus datos. Nuestro equipo te contactará para confirmar tu clase de prueba.';
  });
</script>
</body>
</html>
